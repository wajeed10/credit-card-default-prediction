name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Hugging Face Hub
        run: python -m pip install "huggingface_hub>=0.30,<2"

      - name: Upload application to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          for filename in [
              "app.py",
              "requirements.txt",
              "tuned_random_forest.joblib",
          ]:
              api.upload_file(
                  path_or_fileobj=filename,
                  path_in_repo=filename,
                  repo_id="Andresh10/credit-card-default-prediction-gradio",
                  repo_type="space",
                  commit_message=f"Deploy {filename} from GitHub Actions",
              )

          print("Deployment files uploaded successfully.")
          PY
